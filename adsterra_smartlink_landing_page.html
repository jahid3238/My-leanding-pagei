<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Something New</title>
<meta name="description" content="Discover exciting opportunities and get started today.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#101827,#243b55);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  border-radius:24px;
  padding:38px 28px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
}
.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.14);
  font-size:13px;
  margin-bottom:20px;
}
h1{font-size:34px;line-height:1.15;margin-bottom:14px}
p{color:#dbe4ef;font-size:16px;line-height:1.6;margin-bottom:26px}
.cta{
  display:block;
  text-decoration:none;
  background:#fff;
  color:#111827;
  font-weight:700;
  font-size:18px;
  padding:16px 22px;
  border-radius:14px;
  transition:.2s;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.25)}
.note{font-size:12px;color:#aebdcd;margin-top:18px}
</style>
</head>
<body>
  <main class="card">
    <div class="badge">✨ Welcome</div>
    <h1>Discover Something New</h1>
    <p>
      Ready to explore? Tap the button below to continue and discover
      an opportunity that may be right for you.
    </p>
    <a class="cta" href="https://auctionr.org/4/7642cf9b0ffd3d2f57b0ae09b1712095" target="_blank" rel="nofollow sponsored noopener">
      Get Started →
    </a>
    <div class="note">By continuing, you may be redirected to a third-party page.</div>
  </main>
</body>
</html>
